name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Same SDK/NDK/CMake versions as BUILD_LOCAL.md.
      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;27.2.12479018
            cmake;3.22.1

      - uses: gradle/actions/setup-gradle@v6

      # The project key lives in repository secrets. Pull requests from forks do not get secrets, and
      # then the build simply falls back to the debug key (the APK works, it just cannot update an
      # install that was signed with the project key).
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FEATHERW8_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/featherw8.jks"
            echo "FEATHERW8_KEYSTORE=$RUNNER_TEMP/featherw8.jks" >> "$GITHUB_ENV"
            echo "Signing with the project key"
          else
            echo "No project key available; signing with the debug key"
          fi

      - name: Unit tests and release APK
        env:
          FEATHERW8_KEYSTORE_PASSWORD: ${{ secrets.FEATHERW8_KEYSTORE_PASSWORD }}
          FEATHERW8_KEY_ALIAS: featherw8
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          version=$(sed -nE 's/^val appVersionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          name="FeatherW8-v${version}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Same fingerprint on every build means every build can update the previous one.
      - name: Show the signing certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "${{ steps.apk.outputs.name }}" \
            | grep -E "SHA-256 digest|Signer #1 certificate DN"

      - name: Tag must match versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.apk.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match appVersionName ${{ steps.apk.outputs.version }}"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: FeatherW8-*.apk
          path: dist-apk
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist-apk/*.apk \
            --title "FeatherW8 ${GITHUB_REF_NAME#v}" \
            "${notes_args[@]}"
